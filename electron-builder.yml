appId: org.cvforge.desktop
productName: CVForge
electronVersion: 44.7.2
electronDist: node_modules/electron/dist
toolsets:
  appimage: '1.0.3'
directories:
  output: out/f9
files:
  - dist/src/**/*
  - dist/renderer/**/*
  - resources/fonts/**/*
  - package.json
asar: true
asarUnpack:
  - '**/*.node'
npmRebuild: false
linux:
  executableName: cvforge
  category: Office
  target: dir
appImage:
  artifactName: CVForge-${version}-x86_64.AppImage
  executableArgs: []
