appId: org.cvforge.desktop
productName: CVPass
copyright: Copyright © 2026 Alexandru David Raboaca Neagu
electronVersion: 44.7.2
electronDist: node_modules/electron/dist
toolsets:
  appimage: '1.0.3'
directories:
  output: out/f9
files:
  - dist/src/**/*
  - dist/renderer/**/*
  - resources/fonts/**/*
  - assets/icons/*.png
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - package.json
asar: true
asarUnpack:
  - '**/*.node'
npmRebuild: false
linux:
  executableName: cvforge
  category: Office
  target: dir
appImage:
  artifactName: CVPass-${version}-x86_64.AppImage
  executableArgs: []
