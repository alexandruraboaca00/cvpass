appId: org.cvforge.desktop
productName: CVPass
copyright: Copyright © 2026 Alexandru David Raboaca Neagu
electronVersion: 44.7.2
electronDist: node_modules/electron/dist
toolsets:
  appimage: '1.0.3'
directories:
  output: out/f9
files:
  - dist/src/**/*
  - dist/renderer/**/*
  - resources/fonts/**/*
  - resources/licenses/**/*
  - assets/icons/*.png
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - package.json
asar: true
asarUnpack:
  - '**/*.node'
npmRebuild: false
linux:
  icon: assets/icons
  executableName: cvforge
  category: Office
  target: dir
appImage:
  artifactName: CVPass-${version}-x86_64.AppImage
  executableArgs: []

win:
  files:
    - "!**/prebuilds/linux*.node"
    - "!**/prebuilds/darwin*.node"
    - "!**/prebuilds/win32-arm64.node"
  icon: assets/icons/cvpass.ico
  executableName: CVPass
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  signAndEditExecutable: true
nsis:
  artifactName: CVPass-${version}-win-x64-Setup.exe
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: CVPass
  deleteAppDataOnUninstall: false
  runAfterFinish: false
portable:
  artifactName: CVPass-${version}-win-x64-Portable.exe
  requestExecutionLevel: user
